version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: computerstore-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong@Passw0rd"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -N -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - computerstore-network

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: computerstore-db-init
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./Backend/computer_store.sql:/tmp/computer_store.sql
    entrypoint: >
      /bin/bash -c "
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P 'YourStrong@Passw0rd' -C -N -i /tmp/computer_store.sql
      "
    networks:
      - computerstore-network

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: computerstore-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:sqlserver://sqlserver:1433;databaseName=ComputerStore;encrypt=true;trustServerCertificate=true
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: "YourStrong@Passw0rd"
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
    volumes:
      - ./Backend/uploads:/app/uploads
    networks:
      - computerstore-network

  frontend:
    build:
      context: ./FrontEnd
      dockerfile: Dockerfile
    container_name: computerstore-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - computerstore-network

volumes:
  sqlserver_data:

networks:
  computerstore-network:
    driver: bridge
