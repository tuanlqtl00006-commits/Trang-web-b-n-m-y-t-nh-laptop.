spring.application.name=computerstore

# SQL Server Configuration
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=ComputerStore;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080
server.servlet.context-path=/
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.root=INFO
logging.level.com.example.computerstore=DEBUG

# Auth token (HMAC signing secret cho token đăng nhập).
# ĐỔI chuỗi này thành một chuỗi ngẫu nhiên dài, giữ bí mật trước khi triển khai
# thật. Nếu để trống, TokenService sẽ dùng secret mặc định KHÔNG an toàn
# (chỉ dùng để chạy demo/dev).
app.security.token-secret=change-this-to-a-long-random-secret-before-deploying
app.security.token-ttl-hours=12
